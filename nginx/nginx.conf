# Konfigurasi Nginx untuk Hosting Lokal di Laptop (Elephant Tracking System)

worker_processes 1;

events {
    worker_connections 1024;
}

# Stream block untuk TCP Socket Forwarding GT02A (Opsional bila GT02A diarahkan ke port 7018 lewat Nginx)
stream {
    upstream gt02a_backend {
        server 127.0.0.1:7018;
    }

    server {
        listen 7018;
        proxy_pass gt02a_backend;
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream NestJS REST API
    upstream nestjs_api {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # Frontend Client (Single Page Application - React Vite)
        location / {
            root   ../frontend/dist;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Proxy REST API ke NestJS Backend (/v1/...)
        location /v1/ {
            proxy_pass http://nestjs_api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger Docs Proxy
        location /v1/docs {
            proxy_pass http://nestjs_api/v1/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
